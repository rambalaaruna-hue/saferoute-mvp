<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeRoute – Night Travel Safety</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

  <!-- App Bar -->
  <div class="app-bar">
    SafeRoute
  </div>

  <div class="container">

    <h2>Plan a Safer Night Journey</h2>
    <p class="description">
      Get AI-powered safety insights before you travel at night.
    </p>

    <!-- Route Input Card -->
    <div class="card">
      <h3>Route Details</h3>
      <input type="text" placeholder="Starting location">
      <input type="text" placeholder="Destination">
      <button id="check-route">Check Safe Route</button>
    </div>

    <!-- Map Card -->
    <div class="card">
      <h3>Route Preview</h3>
      <div id="map">
        Map will appear here once Google Maps API is connected
      </div>
    </div>

    <!-- Safety Level Card -->
    <div class="card">
      <h3>Safety Level</h3>
      <p id="safety-level" class="status medium">
        <span class="material-icons">warning</span> —
      </p>
    </div>

    <!-- AI Explanation Card -->
    <div class="card">
      <h3>AI Safety Explanation</h3>
      <p id="ai-explanation">—</p>
    </div>

    <!-- Incident Reporting -->
    <div class="card">
      <h3>Report an Incident</h3>
      <textarea rows="3" placeholder="Describe the unsafe area or issue..."></textarea>
      <button class="secondary">Report Unsafe Area</button>
    </div>

  </div>

  <!-- Dummy Frontend Logic (for Demo) -->
  <script>
    document.getElementById("check-route").addEventListener("click", () => {
      document.getElementById("safety-level").innerHTML =
        '<span class="material-icons">warning</span> Moderate Risk';

      document.getElementById("ai-explanation").textContent =
        "This route has low street lighting and limited pedestrian movement after 10 PM. Consider an alternative route or travel with caution.";
    });
  </script>

</body>
</html>
