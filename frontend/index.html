<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeRoute – Night Travel Safety</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f7f8fa;
      margin: 0;
      color: #333;
    }

    /* Top App Bar */
    .app-bar {
      background: #ffffff;
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 600;
      color: #1976d2;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 16px;
    }

    h2 {
      margin-top: 8px;
      color: #1976d2;
    }

    p.description {
      color: #555;
      margin-bottom: 24px;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #333;
    }

    /* Cards */
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 16px;
      margin-bottom: 20px;
    }

    /* Inputs */
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    /* Buttons */
    button {
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #1565c0;
    }

    button.secondary {
      background-color: #f1f3f4;
      color: #1976d2;
    }

    /* Map Placeholder */
    #map {
      height: 280px;
      background: #e0e0e0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
      color: #555;
    }

    /* Safety Status */
    .status {
      font-weight: 600;
      font-size: 16px;
    }

    .status.low { color: #4caf50; }
    .status.medium { color: #ff9800; }
    .status.high { color: #f44336; }

    .material-icons {
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>

<body>

  <!-- App Bar -->
  <div class="app-bar">
    SafeRoute
  </div>

  <div class="container">

    <h2>Plan a Safer Night Journey</h2>
    <p class="description">
      Get AI-powered safety insights before you travel at night.
    </p>

    <!-- Route Input Card -->
    <div class="card">
      <h3>Route Details</h3>
      <input type="text" placeholder="Starting location">
      <input type="text" placeholder="Destination">
      <button id="check-route">Check Safe Route</button>
    </div>

    <!-- Map Card -->
    <div class="card">
      <h3>Route Preview</h3>
      <div id="map">
        Map will appear here once Google Maps API is connected
      </div>
    </div>

    <!-- Safety Level Card -->
    <div class="card">
      <h3>Safety Level</h3>
      <p id="safety-level" class="status medium">
        <span class="material-icons">warning</span> —
      </p>
    </div>

    <!-- AI Explanation Card -->
    <div class="card">
      <h3>AI Safety Explanation</h3>
      <p id="ai-explanation">—</p>
    </div>

    <!-- Incident Reporting -->
    <div class="card">
      <h3>Report an Incident</h3>
      <textarea rows="3" placeholder="Describe the unsafe area or issue..."></textarea>
      <button class="secondary">Report Unsafe Area</button>
    </div>

  </div>

  <!-- Dummy Frontend Logic (for Demo) -->
  <script>
    document.getElementById("check-route").addEventListener("click", () => {
      document.getElementById("safety-level").innerHTML =
        '<span class="material-icons">warning</span> Moderate Risk';

      document.getElementById("ai-explanation").textContent =
        "This route has low street lighting and limited pedestrian movement after 10 PM. Consider an alternative route or travel with caution.";
    });
  </script>

</body>
</html>
